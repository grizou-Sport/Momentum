name: MOMENTUM quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the committed lockfile
        run: npm ci --ignore-scripts
      - name: Check source, run every test, build static output
        run: npm run build
      - name: Record the exact tested commit
        run: git rev-parse HEAD > tested-commit.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-site-${{ github.sha }}
          path: |
            dist/
            tested-commit.txt
          if-no-files-found: error
          retention-days: 14

  cdc:
    name: CDC completeness
    if: contains(github.head_ref || github.ref_name, 'cdc-consolidation') || contains(github.head_ref || github.ref_name, 'cdc-recovery')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-cdc.mjs
