name: CDC isolated test toolchain
on:
  push:
    branches: [feat/cdc-consolidation-2026-09-08]
    paths: [.github/workflows/cdc-toolchain.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Dépendances de tests seulement, sans accès aux données de production
        run: |
          mkdir -p /tmp/toolchain/vendor
          cd /tmp/toolchain
          npm init -y
          npm install --ignore-scripts --save-exact @electric-sql/pglite@0.5.8
          curl --fail --location --retry 2 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js' -o vendor/leaflet.js
          curl --fail --location --retry 2 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' -o vendor/leaflet.css
          curl --fail --location --retry 2 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2' -o vendor/supabase.js
          curl --fail --location --retry 2 'https://cdn.jsdelivr.net/npm/chart.js' -o vendor/chart.js
          sha256sum vendor/* > vendor/SHA256SUMS
          tar -czf /tmp/cdc-toolchain.tgz -C /tmp/toolchain .
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cdc-test-toolchain
          path: /tmp/cdc-toolchain.tgz
          retention-days: 3
